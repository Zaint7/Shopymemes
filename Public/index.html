<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopymemes | Tienda de productos de memes</title>
  <meta name="description" content="Tazas, cojines, llaveros y más productos con tus memes favoritos. Compra en Shopymemes y haz tu pedido por WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shopymemes">
  <meta property="og:title" content="Shopymemes | Tienda de productos de memes">
  <meta property="og:description" content="Tus memes favoritos en un solo lugar.">
  <meta property="og:image" content="/fondo.png">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="shared.js"></script>
  <script src="products.js?v=2"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-white text-dark rounded z-3" href="#productos">Saltar a los productos</a>

<!-- ============================================= -->
<!-- NAVBAR: logo, carrito con contador, menú móvil -->
<!-- ============================================= -->
<header id="navbar-placeholder" class="sticky-top"></header>

<main>
<!-- ================================================ -->
<!-- HERO: bienvenida principal con CTA hacia productos -->
<!-- ================================================ -->
<section class="hero d-flex align-items-center text-center px-4">
  <div class="container">
    <h1 class="fw-bold mb-0">Tus memes favoritos en un solo lugar</h1>
  </div>
</section>

<!-- Divisor decorativo animado, separa bienvenida de productos -->
<div class="rainbow-divider" aria-hidden="true"></div>

<!-- ======================================================= -->
<!-- GRID DE PRODUCTOS: filtro (A-Z/precio) + tarjetas dinámicas -->
<!-- Las tarjetas se generan con JS desde Firestore (products.js). -->
<!-- Si la URL trae ?category=X o ?search=X, se filtra solo.    -->
<!-- ======================================================= -->
<section class="container page-section" id="productos" tabindex="-1">
  <h2 class="page-title" id="pageTitle">Todos nuestros productos</h2>

  <div class="mb-3">
    <div class="dropdown">
      <button class="btn btn-outline-dark btn-sm dropdown-toggle rounded-pill" type="button" id="filterBtn" data-bs-toggle="dropdown" aria-expanded="false">
        Filtrar
      </button>
      <ul class="dropdown-menu" aria-labelledby="filterBtn">
        <li>
          <button type="button" class="dropdown-item d-flex justify-content-between align-items-center" id="sortAlpha">
            <span>A - Z</span>
            <span id="alphaArrow" aria-hidden="true">↓</span>
          </button>
        </li>
        <li><button type="button" class="dropdown-item" data-sort="price-asc">Menor precio</button></li>
        <li><button type="button" class="dropdown-item" data-sort="price-desc">Mayor precio</button></li>
      </ul>
    </div>
  </div>

  <div class="row g-3" id="productGrid" aria-live="polite" aria-busy="true">
    <div class="col-12 text-center text-muted py-5">Cargando productos...</div>
  </div>
</section>
</main>

<!-- ============================================= -->
<!-- FOOTER: se carga desde footer.html (layout.js)  -->
<!-- (compartido entre todas las páginas del sitio)   -->
<!-- ============================================= -->
<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================= -->
<!-- SCRIPT: renderizado y lógica del grid de productos -->
<!-- Espera a que Firestore termine de cargar (productsReady) -->
<!-- ============================================= -->
<script>
  productsReady.then(() => {
    const productGrid = document.getElementById('productGrid');
    productGrid.setAttribute('aria-busy', 'false');

    // Dibuja las tarjetas de producto a partir de una lista dada (productCardHtml viene de shared.js)
    function renderProducts(list) {
      productGrid.innerHTML = list.map(p => productCardHtml(p)).join('');
    }

    // El texto se escapa: puede venir de la URL (?search=...) y no debe interpretarse como HTML
    function showEmptyMessage(text) {
      productGrid.innerHTML = `<div class="col-12 text-center text-muted py-5">${escapeHtml(text)}</div>`;
    }

    // La URL puede traer ?search=X (buscador del navbar) o ?category=X (categorías).
    // Si trae ambos o ninguno, se muestran todos los productos.
    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = (urlParams.get('search') || '').trim().slice(0, LIMITS.searchQuery);
    const categoryParam = (urlParams.get('category') || '').slice(0, LIMITS.categorySlug);

    // En búsquedas y categorías el hero se oculta y el título de la sección pasa a ser el <h1>
    function hideHeroSection(title) {
      document.querySelector('.hero').classList.add('d-none');
      document.querySelector('.hero + .rainbow-divider').classList.add('d-none');
      const oldTitle = document.getElementById('pageTitle');
      const h1 = document.createElement('h1');
      h1.id = oldTitle.id;
      h1.className = oldTitle.className;
      h1.textContent = title;
      oldTitle.replaceWith(h1);
      document.title = `${title} | Shopymemes`;
    }

    if (productsLoadFailed) {
      showEmptyMessage('No pudimos cargar los productos. Intenta de nuevo en un momento.');
    } else if (products.length === 0) {
      showEmptyMessage('Aún no hay productos. ¡Vuelve pronto!');
    } else if (searchParam) {
      const query = searchParam.toLowerCase();
      const filtered = products.filter(p =>
        p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)
      );
      renderProducts(filtered);
      hideHeroSection(`Resultados para "${searchParam}"`);
      if (filtered.length === 0) showEmptyMessage(`No encontramos productos para "${searchParam}".`);
    } else if (categoryParam) {
      const filtered = products.filter(p => p.category === categoryParam);
      renderProducts(filtered);
      const nombre = categoryParam.replace(/-/g, ' ');
      hideHeroSection(nombre.charAt(0).toUpperCase() + nombre.slice(1));
      if (filtered.length === 0) showEmptyMessage('Aún no hay productos en esta categoría.');
    } else {
      renderProducts(products);
    }

    // --- Filtro: alternar A-Z / Z-A ---
    const alphaBtn = document.getElementById('sortAlpha');
    const alphaArrow = document.getElementById('alphaArrow');
    const filterBtn = document.getElementById('filterBtn');
    let alphaAscending = true;

    function sortProducts(compareFn) {
      const items = Array.from(productGrid.querySelectorAll('.product-item'));
      items.sort(compareFn);
      items.forEach(item => productGrid.appendChild(item));
    }

    alphaBtn.addEventListener('click', () => {
      sortProducts((a, b) => {
        const nameA = a.dataset.name.toLowerCase();
        const nameB = b.dataset.name.toLowerCase();
        return alphaAscending ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
      });

      const label = alphaAscending ? 'A - Z' : 'Z - A';
      alphaBtn.querySelector('span').textContent = label;
      alphaArrow.textContent = alphaAscending ? '↓' : '↑';
      filterBtn.textContent = label;
      alphaAscending = !alphaAscending;
    });

    // --- Filtro: ordenar por precio ---
    document.querySelectorAll('[data-sort^="price"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const order = btn.dataset.sort;
        sortProducts((a, b) => {
          const priceA = parseInt(a.dataset.price);
          const priceB = parseInt(b.dataset.price);
          return order === 'price-asc' ? priceA - priceB : priceB - priceA;
        });
        filterBtn.textContent = btn.textContent;
      });
    });

    // --- Agregar al carrito ---
    productGrid.addEventListener('click', (e) => {
      if (e.target.matches('button[data-id]')) {
        addToCart(parseInt(e.target.dataset.id));
      }
    });
  });
</script>

<script>
  // Banner dinámico: empieza alto y se encoge al hacer scroll
  const hero = document.querySelector('.hero');
  const HERO_MIN = 260; // debe coincidir con el min-height del CSS

  function updateHero() {
    const heroMax = window.innerHeight * 0.75; // altura inicial: 75% de la pantalla
    const newHeight = Math.max(HERO_MIN, heroMax - window.scrollY);
    hero.style.height = newHeight + 'px';
  }

  window.addEventListener('scroll', updateHero, { passive: true });
  window.addEventListener('resize', updateHero);
  updateHero();
</script>

</body>
</html>
