<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopymemes - Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="products.js?v=1"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Miniaturas de la galería del producto */
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .thumb {
      width: 64px; height: 64px; padding: 0; overflow: hidden;
      border: 2px solid transparent; border-radius: 10px;
      background: none; cursor: pointer; opacity: 0.7;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.active { border-color: #1b1c22; opacity: 1; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============================================= -->
<!-- NAVBAR: se carga desde navbar.html (layout.js) -->
<!-- ============================================= -->
<div id="navbar-placeholder" class="sticky-top"></div>



<!-- ==================================================== -->
<!-- DETALLE DE PRODUCTO: se genera con JS según ?id=X     -->
<!-- Incluye imagen, precio, stock, descripción, botón,    -->
<!-- link de volver y la sección de "Productos similares"  -->
<!-- ==================================================== -->
<section class="container my-5" id="productDetail">
  <!-- Contenido generado dinámicamente -->
</section>

<!-- ============================================= -->
<!-- FOOTER: se carga dinámicamente desde footer.html -->
<!-- (compartido entre todas las páginas del sitio)   -->
<!-- ============================================= -->
<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================= -->
<!-- SCRIPT: carga del footer + botón volver arriba -->
<!-- ============================================= -->
<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;

      const backToTopBtn = document.getElementById('backToTop');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) backToTopBtn.classList.add('show');
        else backToTopBtn.classList.remove('show');
      });
      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
</script>

<!-- ============================================= -->
<!-- SCRIPT: lógica del detalle de producto         -->
<!-- (addToCart viene de cart.js)                   -->
<!-- Espera a que Firestore termine de cargar       -->
<!-- (productsReady, definido en products.js)       -->
<!-- ============================================= -->
<script>
  productsReady.then(() => {
    // Lee el ?id=X de la URL y busca el producto correspondiente
    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));
    const product = products.find(p => p.id === productId);

    const container = document.getElementById('productDetail');

    // Genera hasta 4 tarjetas de productos distintos al actual.
    // Si stock es 0: sello "Agotado" en la foto y botón desactivado.
    function renderSimilarProducts() {
      const similar = products.filter(p => p.id !== product.id).slice(0, 4);

      return `
        <div class="rainbow-divider my-5"></div>
        <h3 class="fw-bold mb-4 text-center">Productos similares</h3>
        <div class="row g-3">
          ${similar.map(p => `
            <div class="col-6 col-md-3">
              <div class="card product-card border-0">
                <a href="product.html?id=${p.id}" class="position-relative d-block">
                  <img src="${p.image}" class="card-img-top" alt="${p.name}">
                  ${p.stock === 0 ? '<span class="out-of-stock-badge">Agotado</span>' : ''}
                </a>
                <div class="card-body px-0">
                  <a href="product.html?id=${p.id}" class="text-decoration-none text-dark">
                    <p class="card-text mb-1 fw-semibold">${p.name}</p>
                  </a>
                  <p class="card-text text-muted mb-2">$${p.price.toLocaleString('es-CO')}</p>
                  <button class="btn btn-dark btn-sm w-100 rounded-pill similar-add-btn" data-id="${p.id}" ${p.stock === 0 ? 'disabled' : ''}>
                    ${p.stock === 0 ? 'Agotado' : 'Agregar al carrito'}
                  </button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Si el producto existe, arma la vista completa; si no, muestra "no encontrado"
    if (product) {
      const outOfStock = product.stock === 0;
      // Productos viejos no tienen "images": se usa su única "image"
      const images = product.images?.length ? product.images : [product.image];
      container.innerHTML = `
        <div class="row g-4 align-items-start mb-4">
          <div class="col-12 col-md-6">
            <img id="mainImage" src="${images[0]}" class="img-fluid rounded w-100" alt="${product.name}">
            ${images.length > 1 ? `
              <div class="thumbs">
                ${images.map((src, i) => `
                  <button type="button" class="thumb ${i === 0 ? 'active' : ''}" data-src="${src}" aria-label="Ver foto ${i + 1}">
                    <img src="${src}" alt="Foto ${i + 1}">
                  </button>
                `).join('')}
              </div>` : ''}
          </div>
          <div class="col-12 col-md-6">
    <a href="index.html?category=${product.category}" class="category-tag mb-2 d-inline-block text-decoration-none">
      ${product.category}
    </a>
    <h1 class="fw-bold mb-2 mt-2">${product.name}</h1>
            <p class="fs-4 fw-semibold mb-3">$${product.price.toLocaleString('es-CO')}</p>
            <p class="${outOfStock ? 'text-danger fw-semibold' : 'text-muted'} mb-3">
              ${outOfStock ? 'Agotado' : `${product.stock} disponibles`}
            </p>
            <p class="text-muted mb-4">${product.description}</p>
            <button class="btn btn-dark btn-lg rounded-pill px-4" id="addToCartBtn" ${outOfStock ? 'disabled' : ''}>
              ${outOfStock ? 'Agotado' : 'Agregar al carrito'}
            </button>
            <div class="mt-4">
              <a href="index.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver a productos
              </a>
            </div>
          </div>
        </div>
        ${renderSimilarProducts()}
      `;

      // Miniaturas: al pulsar una, pasa a ser la imagen grande
      container.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('mainImage').src = btn.dataset.src;
          container.querySelectorAll('.thumb').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Botón principal: agrega el producto que se está viendo
      document.getElementById('addToCartBtn').addEventListener('click', () => addToCart(product.id));

      // Botones de "Productos similares": agregan el producto de esa tarjeta
      container.addEventListener('click', (e) => {
        if (e.target.matches('.similar-add-btn')) {
          addToCart(parseInt(e.target.dataset.id));
        }
      });
    } else {
      container.innerHTML = `
        <div class="text-center py-5">
          <h2 class="fw-bold mb-3">Producto no encontrado</h2>
          <a href="index.html" class="btn btn-dark rounded-pill px-4">Volver a productos</a>
        </div>
      `;
    }
  });
</script>
</body>
</html>
