<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías | Shopymemes</title>
  <meta name="description" content="Explora los productos de Shopymemes por categoría: mugs, almohadas, llaveros y más.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shopymemes">
  <meta property="og:title" content="Categorías | Shopymemes">
  <meta property="og:description" content="Explora los productos de memes por categoría.">
  <meta property="og:image" content="/fondo.png">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="shared.js"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- ============================================= -->
<!-- NAVBAR: se carga desde navbar.html (layout.js) -->
<!-- ============================================= -->
<header id="navbar-placeholder" class="sticky-top"></header>

<!-- ============================================= -->
<!-- MOSAICO DE CATEGORÍAS: cargado desde Firestore -->
<!-- Cada tarjeta lleva a index.html?category=X      -->
<!-- Usa la misma tarjeta y la misma cuadrícula que  -->
<!-- los productos, para que todo mida igual         -->
<!-- ============================================= -->
<main class="container page-section">
  <h1 class="page-title">Categorías</h1>

  <div class="row g-3" id="categoryGrid" aria-busy="true"></div>
  <div class="text-center text-muted py-5" id="categoryEmptyState" role="status">
    Cargando categorías...
  </div>
</main>

<!-- ============================= -->
<!-- FOOTER: se carga desde footer.html (layout.js) -->
<!-- ============================= -->
<div id="footer-placeholder" class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================= -->
<!-- SCRIPT: carga las categorías desde Firestore   -->
<!-- (esta página no necesita products.js)          -->
<!-- ============================================= -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyC1r4Sa7avDiQocrJQaxS0dS-7P3UEE5K4",
    authDomain: "shopymemes.firebaseapp.com",
    projectId: "shopymemes",
    storageBucket: "shopymemes.firebasestorage.app",
    messagingSenderId: "204919104271",
    appId: "1:204919104271:web:c2ba48efa348277c2b947a"
  });

  const grid = document.getElementById('categoryGrid');
  const emptyState = document.getElementById('categoryEmptyState');

  try {
    const snap = await getDocs(collection(getFirestore(app), 'categories'));
    const categories = snap.docs
      .map(d => d.data())
      .sort((a, b) => a.name.localeCompare(b.name));

    if (categories.length === 0) {
      emptyState.textContent = 'Aún no hay categorías creadas.';
    } else {
      emptyState.remove();
      grid.innerHTML = categories.map(c => `
        <div class="col-6 col-md-4 col-lg-3">
          <a href="index.html?category=${encodeURIComponent(c.slug)}" class="text-decoration-none d-block h-100">
            <div class="card product-card border-0">
              <div class="product-card-media">
                <img src="${escapeHtml(c.image)}" class="card-img-top" alt="" loading="lazy">
              </div>
              <div class="card-body px-0">
                <h2 class="category-card-title">${escapeHtml(c.name)}</h2>
              </div>
            </div>
          </a>
        </div>
      `).join('');
    }
  } catch (err) {
    console.error('No se pudieron cargar las categorías', err);
    emptyState.textContent = 'No pudimos cargar las categorías. Intenta de nuevo en un momento.';
  } finally {
    grid.setAttribute('aria-busy', 'false');
  }
</script>
</body>
</html>
