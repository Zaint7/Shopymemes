<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas | Shopymemes</title>
  <meta name="description" content="Productos de memes con descuento en Shopymemes: tazas, cojines, llaveros y más a precio rebajado.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shopymemes">
  <meta property="og:title" content="Ofertas | Shopymemes">
  <meta property="og:description" content="Productos de memes con descuento.">
  <meta property="og:image" content="/fondo.png">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="shared.js"></script>
  <script src="products.js?v=2"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-white text-dark rounded z-3" href="#productos">Saltar a los productos</a>

<!-- ============================================= -->
<!-- NAVBAR: logo, carrito con contador, menú móvil -->
<!-- ============================================= -->
<header id="navbar-placeholder" class="sticky-top"></header>

<!-- ======================================================= -->
<!-- GRID DE PRODUCTOS: filtro (A-Z/precio) + tarjetas dinámicas -->
<!-- Las tarjetas se generan con JS desde Firestore (products.js). -->
<!-- Solo se muestran los productos marcados con offer: true.    -->
<!-- ======================================================= -->
<main class="container page-section" id="productos" tabindex="-1">
  <h1 class="page-title">Nuestras ofertas</h1>

  <div class="mb-3">
    <div class="dropdown">
      <button class="btn btn-outline-dark btn-sm dropdown-toggle rounded-pill" type="button" id="filterBtn" data-bs-toggle="dropdown" aria-expanded="false">
        Filtrar
      </button>
      <ul class="dropdown-menu" aria-labelledby="filterBtn">
        <li>
          <button type="button" class="dropdown-item d-flex justify-content-between align-items-center" id="sortAlpha">
            <span>A - Z</span>
            <span id="alphaArrow" aria-hidden="true">↓</span>
          </button>
        </li>
        <li><button type="button" class="dropdown-item" data-sort="price-asc">Menor precio</button></li>
        <li><button type="button" class="dropdown-item" data-sort="price-desc">Mayor precio</button></li>
      </ul>
    </div>
  </div>

  <div class="row g-3" id="productGrid" aria-live="polite" aria-busy="true">
    <div class="col-12 text-center text-muted py-5">Cargando ofertas...</div>
  </div>
</main>

<!-- ============================================= -->
<!-- FOOTER: se carga desde footer.html (layout.js)  -->
<!-- (compartido entre todas las páginas del sitio)   -->
<!-- ============================================= -->
<div id="footer-placeholder" class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================= -->
<!-- SCRIPT: renderizado y lógica del grid de productos -->
<!-- Espera a que Firestore termine de cargar (productsReady) -->
<!-- ============================================= -->
<script>
  productsReady.then(() => {
    const productGrid = document.getElementById('productGrid');
    productGrid.setAttribute('aria-busy', 'false');

    // Página de Ofertas: solo los productos marcados con offer: true (productCardHtml viene de shared.js)
    const offers = products.filter(p => p.offer);
    productGrid.innerHTML = offers.map(p => productCardHtml(p)).join('');

    if (productsLoadFailed) {
      productGrid.innerHTML = '<div class="col-12 text-center text-muted py-5">No pudimos cargar las ofertas. Intenta de nuevo en un momento.</div>';
    } else if (offers.length === 0) {
      productGrid.innerHTML = '<div class="col-12 text-center text-muted py-5">Por ahora no hay ofertas. ¡Vuelve pronto!</div>';
    }

    // --- Filtro: alternar A-Z / Z-A ---
    const alphaBtn = document.getElementById('sortAlpha');
    const alphaArrow = document.getElementById('alphaArrow');
    const filterBtn = document.getElementById('filterBtn');
    let alphaAscending = true;

    function sortProducts(compareFn) {
      const items = Array.from(productGrid.querySelectorAll('.product-item'));
      items.sort(compareFn);
      items.forEach(item => productGrid.appendChild(item));
    }

    alphaBtn.addEventListener('click', () => {
      sortProducts((a, b) => {
        const nameA = a.dataset.name.toLowerCase();
        const nameB = b.dataset.name.toLowerCase();
        return alphaAscending ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
      });

      const label = alphaAscending ? 'A - Z' : 'Z - A';
      alphaBtn.querySelector('span').textContent = label;
      alphaArrow.textContent = alphaAscending ? '↓' : '↑';
      filterBtn.textContent = label;
      alphaAscending = !alphaAscending;
    });

    // --- Filtro: ordenar por precio ---
    document.querySelectorAll('[data-sort^="price"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const order = btn.dataset.sort;
        sortProducts((a, b) => {
          const priceA = parseInt(a.dataset.price);
          const priceB = parseInt(b.dataset.price);
          return order === 'price-asc' ? priceA - priceB : priceB - priceA;
        });
        filterBtn.textContent = btn.textContent;
      });
    });

    // --- Agregar al carrito ---
    productGrid.addEventListener('click', (e) => {
      if (e.target.matches('button[data-id]')) {
        addToCart(parseInt(e.target.dataset.id));
      }
    });
  });
</script>

</body>
</html>
