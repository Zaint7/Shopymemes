<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopymemes - Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============================================= -->
<!-- NAVBAR: se carga desde navbar.html (layout.js) -->
<!-- ============================================= -->
<div id="navbar-placeholder" class="sticky-top"></div>



<!-- ============================================= -->
<!-- MOSAICO DE CATEGORÍAS: cargado desde Firestore -->
<!-- Cada tarjeta lleva a index.html?category=X      -->
<!-- ============================================= -->
<section class="container my-5">
  <h1 class="fw-bold mb-4 text-center">Categorías</h1>

  <div class="row g-3" id="categoryGrid"></div>
  <div class="text-center text-muted py-5" id="categoryEmptyState" style="display:none;">
    Aún no hay categorías creadas.
  </div>
</section>

<!-- ============================= -->
<!-- FOOTER: se carga dinámicamente -->
<!-- ============================= -->
<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;

      const backToTopBtn = document.getElementById('backToTop');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) backToTopBtn.classList.add('show');
        else backToTopBtn.classList.remove('show');
      });
      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
</script>

<!-- ============================================= -->
<!-- SCRIPT: carga las categorías desde Firestore   -->
<!-- (esta página no necesita products.js)          -->
<!-- ============================================= -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyC1r4Sa7avDiQocrJQaxS0dS-7P3UEE5K4",
    authDomain: "shopymemes.firebaseapp.com",
    projectId: "shopymemes",
    storageBucket: "shopymemes.firebasestorage.app",
    messagingSenderId: "204919104271",
    appId: "1:204919104271:web:c2ba48efa348277c2b947a"
  });

  const grid = document.getElementById('categoryGrid');
  const emptyState = document.getElementById('categoryEmptyState');

  try {
    const snap = await getDocs(collection(getFirestore(app), 'categories'));
    const categories = snap.docs
      .map(d => d.data())
      .sort((a, b) => a.name.localeCompare(b.name));

    if (categories.length === 0) {
      emptyState.style.display = 'block';
    } else {
      grid.innerHTML = categories.map(c => `
        <div class="col-6 col-md-4">
          <a href="index.html?category=${encodeURIComponent(c.slug)}" class="text-decoration-none">
            <div class="card product-card border-0">
              <img src="${c.image}" class="card-img-top" alt="${c.name}">
              <div class="card-body px-0 text-center">
                <p class="card-text fw-semibold fs-5 mb-0 text-dark">${c.name}</p>
              </div>
            </div>
          </a>
        </div>
      `).join('');
    }
  } catch (err) {
    console.error('No se pudieron cargar las categorías', err);
    emptyState.textContent = 'No pudimos cargar las categorías. Intenta de nuevo en un momento.';
    emptyState.style.display = 'block';
  }
</script>
</body>
</html>
