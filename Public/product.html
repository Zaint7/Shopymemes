<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto | Shopymemes</title>
  <meta name="description" content="Detalle del producto en Shopymemes, la tienda de productos de memes.">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Shopymemes">
  <meta property="og:title" content="Producto | Shopymemes">
  <meta property="og:image" content="/fondo.png">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="shared.js"></script>
  <script src="products.js?v=2"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- ============================================= -->
<!-- NAVBAR: se carga desde navbar.html (layout.js) -->
<!-- ============================================= -->
<header id="navbar-placeholder" class="sticky-top"></header>

<!-- ==================================================== -->
<!-- DETALLE DE PRODUCTO: se genera con JS según ?id=X     -->
<!-- Incluye imagen, precio, stock, descripción, botón,    -->
<!-- link de volver y la sección de "Productos similares"  -->
<!-- ==================================================== -->
<main class="container page-section" id="productDetail" aria-busy="true">
  <p class="text-center text-muted py-5">Cargando producto...</p>
</main>

<!-- ============================================= -->
<!-- FOOTER: se carga desde footer.html (layout.js)  -->
<!-- (compartido entre todas las páginas del sitio)   -->
<!-- ============================================= -->
<div id="footer-placeholder" class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================= -->
<!-- SCRIPT: lógica del detalle de producto         -->
<!-- (addToCart viene de cart.js; escapeHtml,       -->
<!-- formatPrice y productCardHtml de shared.js)    -->
<!-- Espera a que Firestore termine de cargar       -->
<!-- (productsReady, definido en products.js)       -->
<!-- ============================================= -->
<script>
  productsReady.then(() => {
    // Lee el ?id=X de la URL y busca el producto correspondiente
    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));
    const product = products.find(p => p.id === productId);

    const container = document.getElementById('productDetail');
    container.setAttribute('aria-busy', 'false');

    // Precio del detalle: con "precio anterior" mayor, se muestra tachado y con el % de descuento
    function detailPriceHtml(p) {
      if (p.oldPrice && p.oldPrice > p.price) {
        const pct = Math.round((1 - p.price / p.oldPrice) * 100);
        return `${formatPrice(p.price)} <span class="fs-6 fw-normal text-muted text-decoration-line-through ms-2"><span class="visually-hidden">Antes </span>${formatPrice(p.oldPrice)}</span> <span class="badge bg-success ms-1 align-middle">-${pct}%</span>`;
      }
      return formatPrice(p.price);
    }

    // Hasta 4 productos distintos al actual: primero los de la misma categoría
    function renderSimilarProducts() {
      const others = products.filter(p => p.id !== product.id);
      const similar = [
        ...others.filter(p => p.category === product.category),
        ...others.filter(p => p.category !== product.category)
      ].slice(0, 4);
      if (similar.length === 0) return '';

      return `
        <div class="rainbow-divider my-5" aria-hidden="true"></div>
        <section aria-labelledby="similarTitle">
          <h2 class="page-title" id="similarTitle">Productos similares</h2>
          <div class="row g-3">
            ${similar.map(p => productCardHtml(p, { colClass: 'col-6 col-md-3', extraBtnClass: 'similar-add-btn' })).join('')}
          </div>
        </section>
      `;
    }

    // Título y descripción de la pestaña / buscadores según el producto
    function updateMeta(p) {
      const title = `${p.name} | Shopymemes`; // texto plano (document.title / atributos)
      const description = (p.description || `${p.name} en Shopymemes`).slice(0, 155); // texto plano
      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute('content', description);
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:image"]').setAttribute('content', p.image);
    }

    // Si el producto existe, arma la vista completa; si no, muestra "no encontrado"
    if (product) {
      updateMeta(product);
      const outOfStock = !(product.stock > 0);
      const name = escapeHtml(product.name);
      // Productos viejos no tienen "images": se usa su única "image"
      const images = product.images?.length ? product.images : [product.image];
      container.innerHTML = `
        <div class="row g-4 align-items-start mb-4">
          <div class="col-12 col-md-6">
            <img id="mainImage" src="${escapeHtml(images[0])}" class="product-detail-media" alt="${name}">
            ${images.length > 1 ? `
              <div class="thumbs" role="group" aria-label="Fotos del producto">
                ${images.map((src, i) => `
                  <button type="button" class="thumb ${i === 0 ? 'active' : ''}" data-src="${escapeHtml(src)}"
                    aria-label="Ver foto ${i + 1} de ${images.length}" aria-pressed="${i === 0}">
                    <img src="${escapeHtml(src)}" alt="" loading="lazy">
                  </button>
                `).join('')}
              </div>` : ''}
          </div>
          <div class="col-12 col-md-6">
            <a href="index.html?category=${encodeURIComponent(product.category)}" class="category-tag mb-2 d-inline-block text-decoration-none">
              ${escapeHtml(product.category)}
            </a>
            <h1 class="product-detail-title fw-bold mb-2 mt-2">${name}</h1>
            <p class="fs-4 fw-semibold mb-3">${detailPriceHtml(product)}</p>
            <p class="${outOfStock ? 'text-danger fw-semibold' : 'text-muted'} mb-3">
              ${outOfStock ? 'Agotado' : product.stock === 1 ? '1 disponible' : `${product.stock} disponibles`}
            </p>
            <p class="product-detail-description text-muted mb-4">${escapeHtml(product.description)}</p>
            <button type="button" class="btn btn-dark btn-lg rounded-pill px-4" id="addToCartBtn" ${outOfStock ? 'disabled' : ''}>
              ${outOfStock ? 'Agotado' : 'Agregar al carrito'}
            </button>
            <div class="mt-4">
              <a href="index.html" class="back-link">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver a productos
              </a>
            </div>
          </div>
        </div>
        ${renderSimilarProducts()}
      `;

      // Miniaturas: al pulsar una, pasa a ser la imagen grande
      container.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('mainImage').src = btn.dataset.src;
          container.querySelectorAll('.thumb').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
        });
      });

      // Botón principal: agrega el producto que se está viendo
      document.getElementById('addToCartBtn').addEventListener('click', () => addToCart(product.id));

      // Botones de "Productos similares": agregan el producto de esa tarjeta
      container.addEventListener('click', (e) => {
        if (e.target.matches('.similar-add-btn')) {
          addToCart(parseInt(e.target.dataset.id));
        }
      });
    } else {
      document.title = 'Producto no encontrado | Shopymemes';
      document.querySelector('meta[name="description"]').setAttribute('content', 'El producto que buscas no existe o ya no está disponible.');
      const robots = document.createElement('meta');
      robots.name = 'robots';
      robots.content = 'noindex';
      document.head.appendChild(robots);
      container.innerHTML = `
        <div class="text-center py-5">
          <h1 class="page-title">${productsLoadFailed ? 'No pudimos cargar el producto' : 'Producto no encontrado'}</h1>
          <a href="index.html" class="btn btn-dark rounded-pill px-4">Volver a productos</a>
        </div>
      `;
    }
  });
</script>
</body>
</html>
