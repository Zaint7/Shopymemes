<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Shopymemes</title>
  <meta name="description" content="Revisa los productos de tu carrito en Shopymemes y envía tu pedido por WhatsApp.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="shared.js"></script>
  <script src="products.js?v=2"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header id="navbar-placeholder" class="sticky-top"></header>

<!-- ============================================= -->
<!-- CARRITO: dos módulos que se dibujan con JS      -->
<!-- (datos guardados en cart.js + products.js)      -->
<!--  1) "Tu pedido": productos, fotos y cantidades  -->
<!--  2) "Resumen": total y botones de compra        -->
<!-- ============================================= -->
<main class="container page-section">
  <h1 class="page-title">Tu carrito</h1>

  <div id="cartNotice" class="alert alert-warning d-none" role="alert"></div>

  <p id="cartLoading" class="text-center text-muted py-5">Cargando carrito...</p>

  <!-- Carrito vacío (o error al cargar): ocupa todo el ancho, centrado -->
  <div id="cartEmpty" class="cart-empty d-none">
    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <p class="cart-empty-title" id="cartEmptyTitle">Tu carrito está vacío</p>
    <p class="text-muted mb-4" id="cartEmptyText">Agrega tus memes favoritos y aparecerán aquí.</p>
    <a href="index.html" class="btn btn-dark rounded-pill px-4">Ver productos</a>
  </div>

  <div id="cartLayout" class="row g-4 align-items-start d-none">

    <!-- ========== MÓDULO 1: TU PEDIDO ========== -->
    <div class="col-12 col-lg-8">
      <section class="cart-module cart-order" aria-labelledby="orderTitle">
        <h2 class="cart-module-title" id="orderTitle" tabindex="-1">Tu pedido</h2>
        <ul class="cart-lines list-unstyled mb-0" id="cartItems"></ul>
        <a href="index.html" class="cart-continue">
          <span aria-hidden="true">←</span> Seguir comprando
        </a>
      </section>
    </div>

    <!-- ========== MÓDULO 2: RESUMEN ========== -->
    <div class="col-12 col-lg-4">
      <aside class="cart-module cart-summary" id="cartSummary" aria-labelledby="summaryTitle">
        <h2 class="cart-module-title" id="summaryTitle">Resumen</h2>
        <dl class="cart-summary-rows" aria-live="polite">
          <div class="cart-summary-row">
            <dt>Productos</dt>
            <dd id="cartCountSummary"></dd>
          </div>
          <div class="cart-summary-row cart-summary-total">
            <dt>Total</dt>
            <dd id="cartTotal"></dd>
          </div>
        </dl>
        <button type="button" class="btn btn-whatsapp w-100 rounded-pill mb-2" id="whatsappBtn">Enviar pedido por WhatsApp</button>
        <button type="button" class="btn btn-outline-light w-100 rounded-pill" id="clearCartBtn">Vaciar carrito</button>
        <p class="cart-summary-note">El pago y la entrega se coordinan por WhatsApp</p>
      </aside>
    </div>
  </div>
</main>

<!-- Barra inferior fija (solo móvil): total + WhatsApp, se oculta cuando el Resumen ya está a la vista -->
<div class="cart-mobile-bar d-lg-none" id="cartMobileBar" hidden>
  <div class="cart-mobile-bar-total">
    <span>Total</span>
    <strong id="cartMobileTotal"></strong>
  </div>
  <button type="button" class="btn btn-whatsapp rounded-pill px-3" id="whatsappMobileBtn">Enviar por WhatsApp</button>
</div>

<div id="footer-placeholder" class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Espera a que Firestore termine de cargar (productsReady) antes de dibujar el carrito -->
<script>
  productsReady.then(() => {
    // Número de WhatsApp que recibe los pedidos: código de país + número, sin + ni espacios
    const WHATSAPP_PEDIDOS = '573242499086';

    const cartLoadingEl = document.getElementById('cartLoading');
    const cartEmptyEl = document.getElementById('cartEmpty');
    const cartLayoutEl = document.getElementById('cartLayout');
    const cartItemsEl = document.getElementById('cartItems');
    const cartSummaryEl = document.getElementById('cartSummary');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartCountEl = document.getElementById('cartCountSummary');
    const cartNoticeEl = document.getElementById('cartNotice');
    const mobileBarEl = document.getElementById('cartMobileBar');
    const mobileTotalEl = document.getElementById('cartMobileTotal');
    cartLoadingEl.remove();

    function showNotice(text) {
      cartNoticeEl.textContent = text;
      cartNoticeEl.classList.toggle('d-none', !text);
    }

    // Une cada línea guardada ({id, qty}) con su producto de products.js
    function getCartLines() {
      return getCart()
        .map(item => ({ product: products.find(p => p.id === item.id), qty: item.qty }))
        .filter(line => line.product); // ignora productos que ya no existan
    }

    function getTotal(lines) {
      return lines.reduce((sum, l) => sum + l.product.price * l.qty, 0);
    }

    // Muestra el estado vacío (o de error) en lugar de los dos módulos
    function showEmpty(title, text) {
      document.getElementById('cartEmptyTitle').textContent = title;
      document.getElementById('cartEmptyText').textContent = text;
      cartEmptyEl.classList.remove('d-none');
      cartLayoutEl.classList.add('d-none');
      mobileBarEl.hidden = true;
      updateMobileBar();
    }

    // Una línea del Módulo 1: foto, nombre + precio unitario, cantidad, subtotal y "Quitar"
    function lineHtml({ product: p, qty }) {
      const name = escapeHtml(p.name);
      const atMax = qty >= maxQtyFor(p);
      return `
        <li class="cart-line" data-id="${escapeHtml(p.id)}">
          <a href="product.html?id=${encodeURIComponent(p.id)}" class="cart-line-photo" tabindex="-1" aria-hidden="true">
            <img src="${escapeHtml(p.image)}" alt="" width="80" height="80" loading="lazy">
          </a>
          <div class="cart-line-info">
            <a href="product.html?id=${encodeURIComponent(p.id)}" class="cart-line-name">${name}</a>
            <p class="cart-line-unit">${formatPrice(p.price)} c/u${atMax ? ' · <span class="text-danger">Máximo disponible</span>' : ''}</p>
            <div class="qty-pill" role="group" aria-label="Cantidad de ${name}">
              <button type="button" class="qty-pill-btn" data-action="dec" aria-label="Quitar uno">−</button>
              <span class="qty-pill-value" aria-live="polite">${qty}</span>
              <button type="button" class="qty-pill-btn" data-action="inc" aria-label="Agregar uno" ${atMax ? 'disabled' : ''}>+</button>
            </div>
          </div>
          <div class="cart-line-side">
            <p class="cart-line-subtotal">${formatPrice(p.price * qty)}</p>
            <button type="button" class="cart-line-remove" data-action="remove" aria-label="Quitar ${name} del carrito">
              <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Quitar
            </button>
          </div>
        </li>`;
    }

    function renderCart() {
      // Si Firestore no cargó, no se toca el carrito guardado (no se sabe el stock real)
      if (productsLoadFailed) {
        showEmpty('No pudimos cargar tu carrito', 'Revisa tu conexión e intenta de nuevo en un momento.');
        return;
      }

      const lines = getCartLines();
      if (lines.length === 0) {
        showEmpty('Tu carrito está vacío', 'Agrega tus memes favoritos y aparecerán aquí.');
        return;
      }

      // Módulo 1: lista de productos
      cartItemsEl.innerHTML = lines.map(lineHtml).join('');

      // Módulo 2: cantidad de productos y total (también en la barra móvil)
      const count = lines.reduce((sum, l) => sum + l.qty, 0);
      const total = formatPrice(getTotal(lines));
      cartCountEl.textContent = count === 1 ? '1 producto' : `${count} productos`;
      cartTotalEl.textContent = total;
      mobileTotalEl.textContent = total;

      cartEmptyEl.classList.add('d-none');
      cartLayoutEl.classList.remove('d-none');
      mobileBarEl.hidden = false;
      updateMobileBar();
    }

    // Barra móvil: se esconde mientras el Resumen (que ya tiene el botón) o el footer están en pantalla.
    // Así nunca tapa el final de la página y no hace falta dejarle espacio debajo del footer.
    // body.cart-bar-visible solo sube el botón "volver arriba" mientras la barra se ve.
    const footerPlaceholderEl = document.getElementById('footer-placeholder');
    const isOnScreen = el => {
      const r = el.getBoundingClientRect();
      return r.height > 0 && r.top < window.innerHeight && r.bottom > 0;
    };
    function updateMobileBar() {
      const covered = isOnScreen(cartSummaryEl) || isOnScreen(footerPlaceholderEl);
      mobileBarEl.classList.toggle('is-hidden', covered);
      document.body.classList.toggle('cart-bar-visible', !mobileBarEl.hidden && !covered);
    }

    // Ajusta cantidades al stock actual y avisa si algo cambió
    function syncAndRender() {
      if (!productsLoadFailed) {
        const adjusted = syncCartWithStock();
        if (adjusted.length > 0) {
          showNotice(`Ajustamos la cantidad de ${adjusted.join(', ')} según el stock disponible.`);
        }
      }
      renderCart();
    }

    // Un solo listener para +, − y Quitar (delegación de eventos).
    // Al redibujar, el foco vuelve al mismo botón para que el teclado no "se pierda".
    cartItemsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = parseInt(btn.closest('[data-id]').dataset.id);
      const action = btn.dataset.action;

      if (action === 'inc' && !changeQty(id, 1)) showCartToast('No hay más unidades disponibles');
      if (action === 'dec') changeQty(id, -1);
      if (action === 'remove') removeFromCart(id);
      renderCart();

      const sameBtn = cartItemsEl.querySelector(`[data-id="${id}"] [data-action="${action}"]:not(:disabled)`);
      (sameBtn || document.getElementById('orderTitle')).focus?.();
    });

    document.getElementById('clearCartBtn').addEventListener('click', () => {
      if (confirm('¿Vaciar el carrito?')) {
        clearCart();
        showNotice('');
        renderCart();
      }
    });

    // Arma el mensaje del pedido y abre WhatsApp (antes revisa otra vez el stock)
    function sendOrder() {
      const adjusted = syncCartWithStock();
      if (adjusted.length > 0) {
        showNotice(`Ajustamos la cantidad de ${adjusted.join(', ')} según el stock disponible. Revisa tu pedido antes de enviarlo.`);
        renderCart();
        return;
      }
      const lines = getCartLines();
      if (lines.length === 0) return renderCart();
      const detalle = lines
        .map(l => `• ${l.qty} x ${l.product.name} - ${formatPrice(l.product.price * l.qty)}`)
        .join('\n');
      const mensaje = `Hola, quiero hacer este pedido en Shopymemes:\n\n${detalle}\n\nTotal: ${formatPrice(getTotal(lines))}`;
      window.open(`https://wa.me/${WHATSAPP_PEDIDOS}?text=${encodeURIComponent(mensaje)}`, '_blank', 'noopener');
    }
    document.getElementById('whatsappBtn').addEventListener('click', sendOrder);
    document.getElementById('whatsappMobileBtn').addEventListener('click', sendOrder);

    window.addEventListener('scroll', updateMobileBar, { passive: true });
    window.addEventListener('resize', updateMobileBar);
    // El footer llega después (layout.js lo carga con fetch): al aparecer, se revisa otra vez
    new MutationObserver(updateMobileBar).observe(footerPlaceholderEl, { childList: true });

    // Si el carrito cambia en otra pestaña, se redibuja aquí también
    window.addEventListener('storage', syncAndRender);

    syncAndRender();
  });
</script>
</body>
</html>
