<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <title>Carrito | Shopymemes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="products.js?v=1"></script>
  <script src="cart.js"></script>
  <script src="layout.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div id="navbar-placeholder" class="sticky-top"></div>

<div class="rainbow-divider"></div>

<!-- CARRITO: se dibuja con JS a partir de lo guardado en cart.js -->
<section class="container my-5">
  <h1 class="fw-bold mb-4 text-center">Tu carrito</h1>

  <div id="cartItems"></div>

  <div id="cartSummary" class="d-none mt-4">
    <div class="d-flex justify-content-between align-items-center fs-5 fw-bold mb-3">
      <span>Total</span>
      <span id="cartTotal"></span>
    </div>
    <button class="btn btn-success w-100 rounded-pill mb-2" id="whatsappBtn">Enviar pedido por WhatsApp</button>
    <button class="btn btn-outline-dark w-100 rounded-pill mb-2" id="clearCartBtn">Vaciar carrito</button>
    <a href="index.html" class="btn btn-link w-100 text-dark">Seguir comprando</a>
  </div>
</section>

<div id="footer-placeholder" class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;

      const backToTopBtn = document.getElementById('backToTop');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) backToTopBtn.classList.add('show');
        else backToTopBtn.classList.remove('show');
      });
      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
</script>

<!-- Espera a que Firestore termine de cargar (productsReady) antes de dibujar el carrito -->
<script>
  productsReady.then(() => {
    // Número de WhatsApp que recibe los pedidos: código de país + número, sin + ni espacios
    const WHATSAPP_NUMBER = '573242499086';

    const cartItemsEl = document.getElementById('cartItems');
    const cartSummaryEl = document.getElementById('cartSummary');
    const cartTotalEl = document.getElementById('cartTotal');

    function formatPrice(n) {
      return '$' + n.toLocaleString('es-CO');
    }

    // Une cada línea guardada ({id, qty}) con su producto de products.js
    function getCartLines() {
      return getCart()
        .map(item => ({ product: products.find(p => p.id === item.id), qty: item.qty }))
        .filter(line => line.product); // ignora productos que ya no existan
    }

    function getTotal(lines) {
      return lines.reduce((sum, l) => sum + l.product.price * l.qty, 0);
    }

    function renderCart() {
      const lines = getCartLines();

      if (lines.length === 0) {
        cartItemsEl.innerHTML = `
          <div class="text-center text-muted py-5">
            <p class="mb-3">Tu carrito está vacío.</p>
            <a href="index.html" class="btn btn-dark rounded-pill px-4">Ver productos</a>
          </div>`;
        cartSummaryEl.classList.add('d-none');
        return;
      }

      cartItemsEl.innerHTML = lines.map(({ product: p, qty }) => `
        <div class="d-flex gap-3 align-items-center py-3 border-bottom" data-id="${p.id}">
          <img src="${p.image}" alt="${p.name}" width="72" height="72" class="rounded flex-shrink-0">
          <div class="flex-grow-1">
            <p class="fw-semibold mb-0">${p.name}</p>
            <p class="text-muted small mb-2">${formatPrice(p.price)}</p>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-dark btn-sm rounded-circle" data-action="dec" aria-label="Quitar uno">−</button>
              <span>${qty}</span>
              <button class="btn btn-outline-dark btn-sm rounded-circle" data-action="inc" aria-label="Agregar uno">+</button>
            </div>
          </div>
          <div class="text-end">
            <p class="fw-semibold mb-2">${formatPrice(p.price * qty)}</p>
            <button class="btn btn-link btn-sm text-danger p-0" data-action="remove">Quitar</button>
          </div>
        </div>
      `).join('');

      cartTotalEl.textContent = formatPrice(getTotal(lines));
      cartSummaryEl.classList.remove('d-none');
    }

    // Un solo listener para +, − y Quitar (delegación de eventos)
    cartItemsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = parseInt(btn.closest('[data-id]').dataset.id);

      if (btn.dataset.action === 'inc') changeQty(id, 1);
      if (btn.dataset.action === 'dec') changeQty(id, -1);
      if (btn.dataset.action === 'remove') removeFromCart(id);
      renderCart();
    });

    document.getElementById('clearCartBtn').addEventListener('click', () => {
      if (confirm('¿Vaciar el carrito?')) {
        clearCart();
        renderCart();
      }
    });

    // Arma el mensaje del pedido y abre WhatsApp
    document.getElementById('whatsappBtn').addEventListener('click', () => {
      const lines = getCartLines();
      const detalle = lines
        .map(l => `• ${l.qty} x ${l.product.name} - ${formatPrice(l.product.price * l.qty)}`)
        .join('\n');
      const mensaje = `Hola, quiero hacer este pedido en Shopymemes:\n\n${detalle}\n\nTotal: ${formatPrice(getTotal(lines))}`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
    });

    // Si el carrito cambia en otra pestaña, se redibuja aquí también
    window.addEventListener('storage', renderCart);

    renderCart();
  });
</script>
</body>
</html>
